services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    container_name: prometheus
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - ./prometheus/.env
    # keep 400 days of metrics so monthly/quarterly reports have data;
    # the size cap deletes the oldest data first if disk use passes 20GB
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=400d
      - --storage.tsdb.retention.size=20GB
    # reachable only from the server itself: Prometheus has no login, and grafana and the reporter use the
    # Docker network. From another machine: ssh -L 9090:localhost:9090 you@server, then http://localhost:9090
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus/config:/etc/prometheus
      - ./prometheus/data:/prometheus
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    container_name: grafana
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - ./grafana/.env
    # no ports published: nginx serves it over HTTPS on port 3000
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus

  unpoller:
    image: ghcr.io/unpoller/unpoller:latest
    restart: unless-stopped
    container_name: unpoller
    env_file:
      - ./unpoller/.env
    volumes:
      - ./unpoller/certs:/etc/unpoller/certs:ro # the UniFi console's certificate, saved by install.sh
    # no ports published: its metrics have no login, and prometheus scrapes it over the Docker network

  # log store for UniFi security events pushed by unpoller (config: loki/config/loki.yml)
  # no ports are published: Loki has no authentication and only grafana and unpoller need it
  loki:
    image: grafana/loki:3.7.8 # pinned: loki/config/loki.yml is written for Loki 3.x
    restart: unless-stopped
    container_name: loki
    user: "${UID:-1000}:${GID:-1000}"
    command: -config.file=/etc/loki/loki.yml
    env_file:
      - ./loki/.env
    volumes:
      - ./loki/config:/etc/loki
      - ./loki/data:/loki

  # Optional: UniFi's firewall log over syslog into Loki (UniFi Network 11 no longer puts blocks of internet
  # traffic in the System Log). On with COMPOSE_PROFILES=syslog; ./install.sh asks. Config: syslog/config.alloy
  syslog:
    image: grafana/alloy:v1.21.0
    restart: unless-stopped
    container_name: syslog
    profiles: [syslog]
    user: "${UID:-1000}:${GID:-1000}"
    # --disable-reporting: don't send usage statistics to Grafana Labs; the web UI stays inside the container
    command: run --disable-reporting --server.http.listen-addr=127.0.0.1:12345 --storage.path=/tmp/alloy /etc/alloy/config.alloy
    env_file:
      - ./syslog/.env
    volumes:
      - ./syslog/config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "0.0.0.0:5514:5514/udp"   # IPv4 only; messages from anything but the UniFi console are dropped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    depends_on:
      - loki

  # weekly/monthly/quarterly PDF reports from prometheus + loki, with a web portal on :8088
  # (sign in with a Grafana account; Grafana admins set up email and the schedule there)
  # command line: docker compose exec reporter python report.py run weekly --no-email
  reporter:
    # ready-made image from GitHub Actions (docker compose pull reporter); "up --build" builds it locally instead
    image: ghcr.io/dzidulajubilee/unifi-monitoring-stack/reporter:latest
    build: ./reporter
    restart: unless-stopped
    container_name: reporter
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - ./reporter/.env
    # no ports published: nginx serves it over HTTPS on port 8088
    volumes:
      - ./reporter/out:/out
    depends_on:
      - prometheus
      - loki
      - grafana

  # HTTPS for Grafana (3000), the reports portal (8088) and Dozzle (8080); config: nginx/default.conf
  nginx:
    image: nginx:1.28-alpine # pinned: update the tag on purpose
    restart: unless-stopped
    container_name: nginx
    ports:
      - '3000:3000'
      - '8088:8088'
      - '8080:8080'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro # server.crt and server.key, made by install.sh
    depends_on:
      - grafana
      - reporter

  # optional log viewer for docker containers. Off unless turned on, because it needs full access to Docker
  # (the socket below gives control of this server): install.sh asks, and sets COMPOSE_PROFILES=dozzle in .env.
  # pinned so a pull doesn't change it unexpectedly (v11 added Dozzle Cloud); update the tag on purpose
  dozzle:
    image: amir20/dozzle:v11.4.1
    restart: unless-stopped
    container_name: dozzle
    profiles: [dozzle]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dozzle/data:/data   # users.yml for the login (not in git; see dozzle/.env.example)
    env_file:
      - ./dozzle/.env
    # no ports published: nginx serves it over HTTPS on port 8080
