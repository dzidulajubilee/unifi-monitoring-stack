name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r reporter/requirements.txt pytest==8.3.3 ruff==0.6.9
      - name: Lint
        run: ruff check reporter grafana/build
      - name: Reporter tests
        run: pytest -q
      - name: Dashboards match their generators
        run: |
          for f in grafana/build/{sites,gateway,aps,clients,switches,pdu,dpi}.py; do python3 "$f"; done
          git diff --exit-code grafana/provisioning/dashboards
      - name: Reporter image builds
        run: docker build -q reporter

  # After the checks pass on main, publish the reporter image so servers can pull it instead of building.
  image:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/reporter
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: reporter
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
