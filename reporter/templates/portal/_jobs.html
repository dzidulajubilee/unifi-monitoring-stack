{% if jobs %}
<h2>In progress</h2>
{% for j in jobs %}
<div class="job"><div>
  <div><span class="dot {{ j.status }}"></span>{{ j.period }} <span class="muted">{{ j.kind }}</span></div>
  <div class="muted mono">{{ {'queued':'Waiting','running':'Making the report'}.get(j.status, '') }}{% if j.to %} · email to {{ j.to }}{% endif %} · {{ j.by }} {{ j.queued_at }}</div>
</div></div>
{% endfor %}
{% endif %}
